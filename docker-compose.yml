version: "3.9"
services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports: ["8123:8123", "9000:9000"]
    ulimits: { nofile: 262144 }
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CLICKHOUSE_USER: ch
      CLICKHOUSE_PASSWORD: chpwd
      CLICKHOUSE_DB: sol

  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: mdp
      POSTGRES_DB: mdp
    ports: ["5432:5432"]

  redis:
    image: redis:7
    ports: ["6379:6379"]