[package]
name = "vault"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "vault"

[dependencies]
anchor-lang = "0.31.1"
anchor-spl = { version = "0.31.1", features = ["token", "associated_token"] }
pyth-solana-receiver-sdk = "0.2.0"
borsh = "0.10"

[features]
no-entrypoint = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
test-sbf = []
cpi = []
no-idl = []
anchor-debug = []
no-log-ix-name = []
custom-heap = []
custom-panic = []